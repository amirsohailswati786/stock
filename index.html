<style>

body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:14px 16px;font-weight:600}

table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--b);padding:6px;text-align:left}
small{color:#888}
@media print{nav,header,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{box-shadow:none}}

td.n,th.n{text-align:right;white-space:nowrap}

function seedAcc(){return SEED.split('\n').map(l=>{const p=l.split('|');return{cat:p[0],no:p[1],name:p[2],bal:+p[3]}})}
let NEWACC=false;if(!D.acc){D.acc=seedAcc();D.accDate='2026-10-08';NEWACC=true}

const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem('stock',JSON.stringify(D))}catch(e){alert('Data save nahi ho saka')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:2});
const unit=n=>(D.items.find(i=>i.name==n)||{}).unit||'';
function stk(){const s={};D.moves.forEach(m=>s[m.item]=(s[m.item]||0)+(m.type=='out'?-m.qty:m.qty));return s}

const fmt3=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:3});

function gsum(){
  const s=stk(),C={},U=new Set();let g=0;
  D.items.forEach(i=>{const c=i.cat||'Other',q=s[i.name]||0,o=C[c]=C[c]||{};o[i.unit]=(o[i.unit]||0)+q;g+=q;U.add(i.unit)});
  return {rows:['Fabric','Grey','Yarn','Other'].filter(c=>C[c]).map(c=>[c,Object.entries(C[c]).map(([u,v])=>fmt3(v)+' '+u).join(' + ')]),grand:fmt3(g),mixed:U.size>1};
}
function gHtml(){
  const G=gsum();
  return G.rows.map(r=>`<div class="row" style="margin-top:6px"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')
  +`<div class="row" style="border-top:1px solid var(--b);margin-top:8px;padding-top:8px"><b>Kul jama (sab ka)</b><b>${G.grand}</b></div>`
  +(G.mixed?'<small>Meter aur lbs ka jama sirf number ka hai.</small>':'');
}
function chUnit(k){const i=D.items[k];if(!i)return;const u=prompt('"'+i.name+'" ki nayi unit (meter, kg, lbs, thaan...)',i.unit);
  if(u&&u.trim()&&u.trim()!=i.unit){i.unit=u.trim();save();inv()}}
let tab='inv';
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));draw()}
function draw(){if(tab=='inv')inv();else if(tab=='sale')ent('out');else if(tab=='pur')ent('in');else if(tab=='acc')acc();else if(tab=='pay')pay();else if(RT=='a')arep();else rep(today())}

function inv(){
  const s=stk();
  $('#v').innerHTML=`<div class="card"><b>Gudam mein kul maal</b>${gHtml()}<small>Unit badalne ke liye item ki unit par dabayein.</small></div>
  <div class="card"><b>Naya item</b>

  <input id="o" type="number" step="any" placeholder="Mojooda (opening) stock">
  <button onclick="addItem()">Shamil karein</button></div>`
  +'<input placeholder="Item ya code dhoondein..." oninput="flt(this.value)">'
  +(()=>{let h='',last=null;[...D.items].sort((a,b)=>(a.cat||'Other').localeCompare(b.cat||'Other')).forEach(i=>{const c=i.cat||'Other';
    if(c!=last){h+=`<h3>${esc(c)}</h3>`;last=c}
    h+=`<div class="card row it" data-n="${esc((i.name+' '+(i.code||'')).toLowerCase())}"><span>${esc(i.name)}<br><small>${esc(i.code||'')}</small></span><b>${fmt(s[i.name]||0)} <u style="cursor:pointer" onclick="chUnit(${D.items.indexOf(i)})">${esc(i.unit)}</u></b></div>`});
    return h||'<div class="card">Abhi koi item nahi. Upar se shamil karein.</div>'})()
  +`<div class="card">
  <button class="g" onclick="bk()">Backup lein (Share / Download)</button>

function addItem(){
  const name=$('#n').value.trim(),u=$('#u').value.trim(),o=+$('#o').value||0;
  if(!name||!u)return alert('Naam aur unit likhein');
  if(D.items.some(i=>i.name.toLowerCase()==name.toLowerCase()))return alert('Ye item pehle se hai');
  D.items.push({name,unit:u});
  if(o>0)D.moves.push({id:Date.now(),date:today(),type:'open',item:name,qty:o,party:'',note:'opening'});
  save();inv();
}

function ent(t){
  if(!D.items.length){$('#v').innerHTML='<div class="card">Pehle Inventory mein item shamil karein.</div>';return}
  const title=t=='in'?'Purchase (maal AAYA)':'Sale (maal GAYA)';
  const last=D.moves.filter(m=>m.type==t).sort((a,b)=>b.id-a.id).slice(0,10);
  $('#v').innerHTML=`<div id="pl"></div><div class="card"><b>${title}</b>
  <select id="i">${D.items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</select>
  <input id="q" type="number" step="any" placeholder="Miqdar" oninput="calcT()">
  <input id="r" type="number" step="any" placeholder="Rate (zaroori nahi)" oninput="calcT()">
  <div class="row"><span>Total</span><b id="tot">0</b></div>
  <input id="p" list="apl" placeholder="Party (Accounts se chunein)">${dl()}
  <input id="d" type="date" value="${today()}">
  <input id="nt" placeholder="Note (zaroori nahi)">
  <button onclick="saveEnt('${t}')">Save</button></div>
  <b>Aakhri entries</b>`
  +(last.map(m=>`<div class="card row"><span>${esc(m.item)}: ${fmt(m.qty)} ${esc(unit(m.item))}${m.total?' × '+fmt(m.rate)+' = <b>'+fmt(m.total)+'</b>':''}<br><small>${m.date} ${esc(m.party||'')}</small></span><span style="white-space:nowrap">${m.total?'<button class="x" style="background:var(--g)" onclick="bill('+m.id+')">Bill</button> ':''}<button class="x" onclick="del(${m.id})">✕</button></span></div>`).join('')||'<div class="card">Koi entry nahi</div>');
}
function saveEnt(t){
  const item=$('#i').value,qty=+$('#q').value;
  if(!item||!(qty>0))return alert('Miqdar likhein');
  if(t=='out'&&qty>(stk()[item]||0)&&!confirm('Stock se zyada hai. Phir bhi save karein?'))return;
  const party=$('#p').value.trim(),rate=+$('#r').value||0,A=accBy(party);
  if(rate>0&&!A&&!confirm('Ye party Accounts mein nahi hai. Sirf stock mein save karein (account mein nahi)?'))return;
  D.moves.push({id:Date.now(),date:$('#d').value||today(),type:t,item,qty,party,note:$('#nt').value.trim(),rate,total:rate>0?Math.round(qty*rate*100)/100:0,acc:A?A.no:''});
  save();ent(t);
}
function del(id){if(confirm('Ye entry hata dein?')){D.moves=D.moves.filter(m=>m.id!=id);save();draw()}}

let WS=false,ONLY=false;
function repModel(d,ws){
  const sec=(t,h)=>{const r=D.moves.filter(m=>m.date==d&&m.type==t),u={};
    r.forEach(m=>{const k=unit(m.item);u[k]=(u[k]||0)+m.qty});
    return {h,rows:r.map(m=>[m.item,fmt(m.qty)+' '+unit(m.item),m.party||'-']),tot:Object.entries(u).map(([k,v])=>fmt(v)+' '+k).join(' + ')}};
  const s=stk();
  return {d,sec:[sec('in','Purchase (maal AAYA)'),sec('out','Sale (maal GAYA)')],
    stock:ws&&!ONLY?D.items.map(i=>[i.name,fmt(s[i.name]||0)+' '+i.unit,'']):null};
}
function rep(d){
  const R=repModel(d,WS);
  const tb=(rows,tot)=>rows.length?`<table><tr><th>Item</th><th>Miqdar</th><th>Party</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}${tot?`<tr><th>KUL</th><th colspan="2">${esc(tot)}</th></tr>`:''}</table>`:'<p>Koi entry nahi</p>';
  const ck=(v,f,t)=>`<label style="display:block;margin:6px 0"><input type="checkbox" style="width:auto" ${v?'checked':''} onchange="${f}=this.checked;rep($('#d').value)"> ${t}</label>`;
  $('#v').innerHTML=rtSw()+`<div class="card"><input id="d" type="date" value="${d}" onchange="rep(this.value)">
  ${ck(ONLY,'ONLY','Sirf total dikhayein (item ke naam ke baghair)')}${ONLY?'':ck(WS,'WS','Mojooda stock bhi shamil karein')}
  <button onclick="pdf()">PDF banayein / Share</button><div id="pl"></div></div>
  <div class="card"><b>Aaj ka khulasa (${d})</b>
  ${R.sec.map(x=>`<div class="row" style="margin-top:8px"><span>${x.h}</span><b>${esc(x.tot||'0')}</b></div>`).join('')}
  <h3>Gudam mein kul maal</h3>${gHtml()}</div>
  ${ONLY?'':`<div class="card">${R.sec.map(x=>`<h3>${x.h}</h3>`+tb(x.rows,x.tot)).join('')}
  ${R.stock?'<h3>Mojooda stock</h3>'+tb(R.stock,''):''}</div>`}`;
}
async function mkPdf(jpgs){
  const enc=s=>new TextEncoder().encode(s),parts=[],xr=[];let off=0;
  const add=b=>{parts.push(b);off+=b.length};
  const obj=(n,head,bin)=>{xr[n]=off;add(enc(n+' 0 obj\n'+head+(bin?'\nstream\n':'\n')));if(bin){add(bin);add(enc('\nendstream\n'))}add(enc('endobj\n'))};
  const N=jpgs.length;
  add(enc('%PDF-1.4\n'));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids['+jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']/Count '+N+'>>');
  jpgs.forEach((j,i)=>{
    const p=3+3*i,c=enc('q 595 0 0 842 0 0 cm /Im0 Do Q');
    obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');
    obj(p+1,'<</Length '+c.length+'>>',c);
    obj(p+2,'<</Type/XObject/Subtype/Image/Width '+j.w+'/Height '+j.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.b.length+'>>',j.b);
  });
  const total=3+3*N,x=off;
  let t='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)t+=String(xr[n]).padStart(10,'0')+' 00000 n \n';
  add(enc(t+'trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF'));
  return new Blob(parts,{type:'application/pdf'});
}
async function pdf(){
  const d=$('#d').value,R=repModel(d,WS),L=[];
  L.push({k:'h1',t:'STOCK REPORT'},{k:'sub',t:d},{k:'gap'},{k:'h2',t:'Aaj ka khulasa'});
  R.sec.forEach(x=>L.push({k:'sum',c:[x.h,x.tot||'0']}));
  const G=gsum();L.push({k:'gap'},{k:'h2',t:'Gudam mein kul maal'});G.rows.forEach(r=>L.push({k:'sum',c:r}));L.push({k:'sum',c:['Kul jama (sab ka)',G.grand]});
  if(!ONLY){L.push({k:'gap'});
    R.sec.forEach(x=>{L.push({k:'h2',t:x.h});
      if(x.rows.length){L.push({k:'th',c:['Item','Miqdar','Party']});x.rows.forEach(r=>L.push({k:'row',c:r}));L.push({k:'tot',t:'KUL: '+x.tot})}
      else L.push({k:'row',c:['Koi entry nahi','','']});
      L.push({k:'gap'})});
    if(R.stock){L.push({k:'h2',t:'Mojooda stock'},{k:'th',c:['Item','Miqdar','']});R.stock.forEach(r=>L.push({k:'row',c:r}))}}
  const W=1240,H=1754,P=70,LH=42,per=Math.floor((H-2*P)/LH),jpgs=[],X=[P,650,950],CW=[560,280,220];
  for(let a=0;a<L.length;a+=per){
    const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';
    const fit=(v,w)=>{let t=String(v);while(g.measureText(t).width>w&&t.length>1)t=t.slice(0,-1);return t==String(v)?t:t.slice(0,-1)+'…'};
    L.slice(a,a+per).forEach((l,n)=>{
      const y=P+n*LH,m=y+LH/2;
      if(l.k=='h1'){g.font='bold 46px sans-serif';g.fillStyle='#0f766e';g.textAlign='center';g.fillText(l.t,W/2,m);g.textAlign='left'}
      else if(l.k=='sub'){g.font='28px sans-serif';g.fillStyle='#333';g.textAlign='center';g.fillText(l.t,W/2,m);g.textAlign='left'}
      else if(l.k=='h2'){g.fillStyle='#0f766e';g.fillRect(P,y+4,W-2*P,LH-8);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.fillText(l.t,P+12,m)}
      else if(l.k=='th'||l.k=='row'){g.fillStyle='#111';g.font=(l.k=='th'?'bold ':'')+'26px sans-serif';
        l.c.forEach((v,i)=>g.fillText(fit(v,CW[i]),X[i],m));
        g.fillStyle='#bbb';g.fillRect(P,y+LH-1,W-2*P,l.k=='th'?3:1)}
      else if(l.k=='sum'){g.fillStyle='#000';g.font='bold 30px sans-serif';g.fillText(l.c[0],P+12,m);g.fillText(fit(l.c[1],W-X[1]-P),X[1],m);g.fillStyle='#bbb';g.fillRect(P,y+LH-1,W-2*P,1)}
      else if(l.k=='tot'){g.fillStyle='#e6f2f1';g.fillRect(P,y+2,W-2*P,LH-4);g.fillStyle='#000';g.font='bold 28px sans-serif';g.fillText(fit(l.t,W-2*P-20),P+12,m)}
    });
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
    jpgs.push({b:new Uint8Array(await b.arrayBuffer()),w:W,h:H});
  }
  const blob=await mkPdf(jpgs),f=new File([blob],'stock-report-'+d+'.pdf',{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const box=$('#pl');if(box)box.innerHTML=`<p><a href="${url}" download="${f.name}" target="_blank" style="color:var(--g);font-weight:700">📄 PDF tayyar hai - yahan dabayein (save / kholein)</a></p>`;
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Stock Report '+d})}catch(e){}
}
async function bk(){
  const txt=JSON.stringify(D),name='stock-backup-'+today()+'.json';
  try{const f=new File([txt],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Stock Backup'});return}
  }catch(e){if(e.name=='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function rs(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const x=JSON.parse(r.result);
    if(!Array.isArray(x.items)||!Array.isArray(x.moves))throw 0;
    if(confirm('Mojooda data hat kar backup lagayein?')){const oa=D.acc,od=D.accDate;D=x;if(!D.acc){D.acc=oa||seedAcc();D.accDate=od}save();inv()}
  }catch(e){alert('Ye sahi backup file nahi')}};
  r.readAsText(f);
}
function flt(v){v=v.toLowerCase();document.querySelectorAll('.it').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')}
let AC='C';const CN={C:'Creditors',D:'Debtors',B:'Bank & Cheque in hand'};
function accTot(c,u){let d=0,k=0;D.acc.filter(a=>a.cat==c).forEach(a=>{const b=cur(a,u);b>0?d+=b:k-=b});return[d,k]}
function acc(){
  const L=D.acc.filter(a=>a.cat==AC).sort((a,b)=>a.name.localeCompare(b.name)),T=accTot(AC);
  const nx=Math.max(10000,...D.acc.map(a=>+a.no||0))+1,z=v=>v?fmt(v):'';
  $('#v').innerHTML=`<div class="tabs">${['C','D','B'].map(c=>`<button class="${c==AC?'':'g'}" onclick="AC='${c}';acc()">${c=='C'?'Creditors':c=='D'?'Debtors':'Bank'}</button>`).join('')}</div>
  <h3>${CN[AC]} <small>(${L.length}) - balance ${esc(D.accDate||'')}</small></h3>
  <input placeholder="Party ya account no dhoondein..." oninput="flt2(this.value)">
  <div class="card"><table><tr><th>Party</th><th class="n">Debit</th><th class="n">Credit</th></tr>
  ${L.map(a=>`<tr class="ar" data-n="${esc((a.name+' '+a.no).toLowerCase())}" onclick="editAcc('${esc(a.no)}')"><td>${esc(a.name)}<br><small>${esc(a.no)}</small></td><td class="n">${cur(a)>0?fmt(cur(a)):''}</td><td class="n">${cur(a)<0?fmt(-cur(a)):''}</td></tr>`).join('')}
  <tr class="ft"><td>Category Total</td><td class="n">${z(T[0])}</td><td class="n">${z(T[1])}</td></tr></table>
  <small>Balance badalne ya hatane ke liye party par dabayein.</small></div>
  <div class="card"><b>Naya account</b>
  <select id="ac">${['C','D','B'].map(c=>`<option value="${c}" ${c==AC?'selected':''}>${CN[c]}</option>`).join('')}</select>
  <input id="an" type="number" placeholder="Account no" value="${nx}">
  <input id="am" placeholder="Party ka naam">
  <input id="ab" type="number" step="any" placeholder="Opening balance">
  <select id="at"><option value="1">Debit / Benaam</option><option value="-1">Credit / Jamma</option></select>
  <button onclick="addAcc()">Account shamil karein</button></div>`;
}
function flt2(v){v=v.toLowerCase();document.querySelectorAll('tr.ar').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')}
function addAcc(){
  const name=$('#am').value.trim(),no=$('#an').value.trim(),b=Math.abs(+$('#ab').value||0)*+$('#at').value;
  if(!name||!no)return alert('Naam aur account no likhein');
  if(D.acc.some(a=>a.no==no))return alert('Ye account no pehle se hai');
  if(D.acc.some(a=>a.name.toLowerCase()==name.toLowerCase())&&!confirm('Is naam ka account pehle se hai. Phir bhi shamil karein?'))return;
  AC=$('#ac').value;D.acc.push({cat:AC,no,name,bal:b});save();acc();
}
function editAcc(no){
  const a=D.acc.find(x=>x.no==no);if(!a)return;
  const r=prompt(a.name+'\nNaya balance likhein (Debit = plus, Credit = minus).\nAccount hatane ke liye "hata" likhein.',cur(a));
  if(r===null)return;
  if(r.trim().toLowerCase()=='hata'){if(confirm('"'+a.name+'" hata dein?')){D.acc=D.acc.filter(x=>x!==a);save();acc()}return}
  const v=+r.replace(/,/g,'');if(isNaN(v))return alert('Sahi number likhein');
  a.bal=v-(cur(a)-a.bal);save();acc();
}
const dl=()=>'<datalist id="apl">'+D.acc.map(a=>'<option value="'+esc(a.name)+'">').join('')+'</datalist>';
const accBy=n=>D.acc.find(a=>a.name.toLowerCase()==String(n).trim().toLowerCase());
const accName=no=>(D.acc.find(a=>a.no==no)||{}).name||no;
const bs=v=>v>0?fmt(v)+' Dr':v<0?fmt(-v)+' Cr':'0';
function led(a){
  const E=[];
  D.moves.forEach(m=>{if((m.type=='out'||m.type=='in')&&m.total>0&&m.acc==a.no)E.push({d:m.date,id:m.id,t:(m.type=='out'?'Sale ':'Purchase ')+m.item+' '+fmt(m.qty)+' x '+fmt(m.rate),dr:m.type=='out'?m.total:0,cr:m.type=='in'?m.total:0})});
  (D.pay||[]).forEach(p=>{
    if(p.acc==a.no)E.push({d:p.date,id:p.id,t:(p.type=='rcv'?'Payment mili':'Payment di')+(p.note?' - '+p.note:''),dr:p.type=='paid'?p.amt:0,cr:p.type=='rcv'?p.amt:0});
    if(p.bank==a.no)E.push({d:p.date,id:p.id,t:(p.type=='rcv'?'Mili: ':'Di: ')+accName(p.acc),dr:p.type=='rcv'?p.amt:0,cr:p.type=='paid'?p.amt:0});
  });
  return E.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.id-y.id);
}
const cur=(a,u)=>a.bal+led(a).filter(e=>!u||e.d<=u).reduce((s,e)=>s+e.dr-e.cr,0);
function ledRows(a,fr,to){
  const E=led(a);let b=a.bal,td=0,tc=0;const rows=[];
  E.filter(e=>fr&&e.d<fr).forEach(e=>b+=e.dr-e.cr);const o=b;
  E.filter(e=>(!fr||e.d>=fr)&&(!to||e.d<=to)).forEach(e=>{b+=e.dr-e.cr;td+=e.dr;tc+=e.cr;rows.push({...e,bal:b})});
  return{o,rows,td,tc,c:b};
}
function calcT(){const t=(+$('#q').value||0)*(+$('#r').value||0);$('#tot').textContent=fmt(Math.round(t*100)/100)}
async function mkDoc(L,fn,X,CW,R){
  const W=1240,H=1754,P=70,LH=42,per=Math.floor((H-2*P)/LH),jpgs=[];
  for(let a=0;a<L.length;a+=per){
    const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';
    const fit=(v,w)=>{let t=String(v);while(g.measureText(t).width>w&&t.length>1)t=t.slice(0,-1);return t==String(v)?t:t.slice(0,-1)+'…'};
    L.slice(a,a+per).forEach((l,n)=>{const y=P+n*LH,m=y+LH/2;
      if(l.k=='h1'||l.k=='sub'){g.font=(l.k=='h1'?'bold 46px':'28px')+' sans-serif';g.fillStyle=l.k=='h1'?'#0f766e':'#333';g.textAlign='center';g.fillText(l.t,W/2,m)}
      else if(l.k=='h2'){g.fillStyle='#0f766e';g.fillRect(P,y+4,W-2*P,LH-8);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.textAlign='left';g.fillText(l.t,P+12,m)}
      else if(l.k=='th'||l.k=='row'||l.k=='tot'){
        if(l.k=='tot'){g.fillStyle='#e6f2f1';g.fillRect(P,y+2,W-2*P,LH-4)}
        g.fillStyle='#111';g.font=(l.k=='row'?'':'bold ')+'25px sans-serif';
        l.c.forEach((v,i)=>{g.textAlign=R[i]?'right':'left';g.fillText(fit(v,CW[i]-8),R[i]?X[i]+CW[i]:X[i],m)});
        g.fillStyle='#bbb';g.fillRect(P,y+LH-1,W-2*P,l.k=='th'?3:1)}
      g.textAlign='left'});
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
    jpgs.push({b:new Uint8Array(await b.arrayBuffer()),w:W,h:H});
  }
  const blob=await mkPdf(jpgs),f=new File([blob],fn,{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const box=$('#pl');if(box)box.innerHTML=`<p><a href="${url}" download="${fn}" target="_blank" style="color:var(--g);font-weight:700">📄 PDF tayyar hai - yahan dabayein (save / kholein)</a></p>`;
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:fn})}catch(e){}
}
async function bill(id){
  const m=D.moves.find(x=>x.id==id);if(!m)return;
  const S=m.type=='out',A=D.acc.find(a=>a.no==m.acc),u=unit(m.item),n=D.moves.filter(x=>x.type==m.type&&x.total).sort((a,b)=>a.id-b.id).findIndex(x=>x.id==id)+1;
  const L=[{k:'h1',t:S?'SALE BILL':'PURCHASE BILL'},{k:'sub',t:'Bill # '+(S?'S':'P')+n+'    Date: '+m.date},{k:'sub',t:'Party: '+(m.party||'-')},{k:'gap'},
    {k:'th',c:['Item','Miqdar','Rate','Total']},{k:'row',c:[m.item,fmt(m.qty)+' '+u,fmt(m.rate),fmt(m.total)]},{k:'tot',c:['KUL','','',fmt(m.total)]}];
  if(m.note)L.push({k:'row',c:['Note: '+m.note,'','','']});
  if(A)L.push({k:'gap'},{k:'row',c:['Party ka mojooda balance','','',bs(cur(A))]});
  await mkDoc(L,(S?'sale':'purchase')+'-bill-'+n+'.pdf',[70,520,780,1000],[440,240,200,170],[0,1,1,1]);
}
let PT='rcv';
function pay(){
  const B=D.acc.filter(a=>a.cat=='B'),L=[...(D.pay||[])].sort((a,b)=>b.id-a.id).slice(0,15);
  $('#v').innerHTML=`<div class="tabs"><button class="${PT=='rcv'?'':'g'}" onclick="PT='rcv';pay()">Received (mili)</button><button class="${PT=='paid'?'':'g'}" onclick="PT='paid';pay()">Paid (di)</button></div>
  <div class="card"><b>${PT=='rcv'?'Payment mili (party se wasool)':'Payment di (party ko ada)'}</b>
  <input id="pa" list="apl" placeholder="Party (Accounts se chunein)">${dl()}
  <input id="pm" type="number" step="any" placeholder="Raqam">
  <select id="pb"><option value="">Bank / Cheque account nahi</option>${B.map(a=>`<option value="${esc(a.no)}">${esc(a.name)}</option>`).join('')}</select>
  <input id="pd" type="date" value="${today()}"><input id="pn" placeholder="Note (cheque no, tafseel...)">
  <button onclick="savePay()">Save</button></div><b>Aakhri payments</b>`
  +(L.map(p=>`<div class="card row"><span>${p.type=='rcv'?'Mili':'Di'}: <b>${fmt(p.amt)}</b> - ${esc(accName(p.acc))}<br><small>${p.date} ${p.bank?esc(accName(p.bank)):''} ${esc(p.note||'')}</small></span><button class="x" onclick="delPay(${p.id})">✕</button></div>`).join('')||'<div class="card">Koi payment nahi</div>');
}
function savePay(){
  const A=accBy($('#pa').value),amt=+$('#pm').value;
  if(!A)return alert('Party Accounts mein se chunein');
  if(!(amt>0))return alert('Raqam likhein');
  (D.pay=D.pay||[]).push({id:Date.now(),date:$('#pd').value||today(),type:PT,acc:A.no,amt,bank:$('#pb').value,note:$('#pn').value.trim()});
  save();pay();
}
function delPay(id){if(confirm('Ye payment hata dein?')){D.pay=D.pay.filter(p=>p.id!=id);save();pay()}}
let RT='s',AM='all',AP='',RD=today(),RF='',RTO='';
const rtSw=()=>`<div class="tabs" style="margin-bottom:8px"><button class="${RT=='s'?'':'g'}" onclick="RT='s';draw()">Stock Report</button><button class="${RT=='a'?'':'g'}" onclick="RT='a';draw()">Account Report</button></div>`;
function arep(){
  const sw=rtSw()+`<div class="card"><select onchange="AM=this.value;arep()"><option value="all" ${AM=='all'?'selected':''}>Sab accounts (Category Balance)</option><option value="one" ${AM=='one'?'selected':''}>Ek party ki detail (Statement)</option></select>`;
  if(AM=='all'){
    $('#v').innerHTML=sw+`<small>Balance on Day</small><input type="date" value="${RD}" onchange="RD=this.value||today();arep()"><button onclick="apdf()">PDF banayein / Share</button><div id="pl"></div></div>`
    +['C','D','B'].map(c=>{const T=accTot(c,RD);return `<div class="card"><b>${CN[c]}</b><div class="row"><span>Debit</span><b>${fmt(T[0])}</b></div><div class="row"><span>Credit</span><b>${fmt(T[1])}</b></div></div>`}).join('');
  }else{
    const a=accBy(AP),R=a&&ledRows(a,RF,RTO);
    $('#v').innerHTML=sw+`<input list="apl" placeholder="Party chunein" value="${esc(AP)}" onchange="AP=this.value;arep()">${dl()}
    <small>Se</small><input type="date" value="${RF}" onchange="RF=this.value;arep()"><small>Tak</small><input type="date" value="${RTO}" onchange="RTO=this.value;arep()">
    ${a?'<button onclick="spdf()">PDF banayein / Share</button>':''}<div id="pl"></div></div>`
    +(a?`<div class="card"><div style="overflow-x:auto"><table class="sm"><tr><th>Date / Detail</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>
    <tr><td>Opening balance</td><td></td><td></td><td class="n">${bs(R.o)}</td></tr>
    ${R.rows.map(e=>`<tr><td>${e.d}<br><small>${esc(e.t)}</small></td><td class="n">${e.dr?fmt(e.dr):''}</td><td class="n">${e.cr?fmt(e.cr):''}</td><td class="n">${bs(e.bal)}</td></tr>`).join('')}
    <tr class="ft"><td>Total / Closing</td><td class="n">${fmt(R.td)}</td><td class="n">${fmt(R.tc)}</td><td class="n">${bs(R.c)}</td></tr></table></div></div>`:'');
  }
}
async function apdf(){
  const L=[{k:'h1',t:'CATEGORY BALANCE'},{k:'sub',t:'Balance on Day: '+RD}];
  ['C','D','B'].forEach(c=>{const T=accTot(c,RD);
    L.push({k:'gap'},{k:'h2',t:CN[c].toUpperCase()},{k:'th',c:['No','Party','Debit','Credit']});
    D.acc.filter(a=>a.cat==c).sort((a,b)=>a.name.localeCompare(b.name)).forEach(a=>{const b=cur(a,RD);L.push({k:'row',c:[a.no,a.name,b>0?fmt(b):'',b<0?fmt(-b):'']})});
    L.push({k:'tot',c:['','Category Total',fmt(T[0]),fmt(T[1])]})});
  await mkDoc(L,'category-balance-'+RD+'.pdf',[70,170,720,945],[100,540,225,225],[0,0,1,1]);
}
async function spdf(){
  const a=accBy(AP);if(!a)return;const R=ledRows(a,RF,RTO);
  const L=[{k:'h1',t:'ACCOUNT STATEMENT'},{k:'sub',t:a.name+' ('+a.no+')'},{k:'sub',t:(RF||'shuru')+'  se  '+(RTO||today())},{k:'gap'},
    {k:'th',c:['Date','Detail','Debit','Credit','Balance']},{k:'row',c:['','Opening balance','','',bs(R.o)]}];
  R.rows.forEach(e=>L.push({k:'row',c:[e.d.slice(2),e.t,e.dr?fmt(e.dr):'',e.cr?fmt(e.cr):'',bs(e.bal)]}));
  L.push({k:'tot',c:['','Total / Closing',fmt(R.td),fmt(R.tc),bs(R.c)]});
  await mkDoc(L,'statement-'+a.no+'.pdf',[70,200,560,755,950],[125,355,190,190,220],[0,0,1,1,1]);
}

if(NEWACC)save();

go('inv');
</script></body></html>
