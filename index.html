<!doctype html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Stock</title>
<style>
:root{--g:#0f766e;--bg:#f4f6f6;--c:#fff;--t:#111;--b:#ccc}
@media(prefers-color-scheme:dark){:root{--bg:#111;--c:#1c1c1c;--t:#eee;--b:#444}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:14px 16px;font-weight:600}
#v{padding:12px}
.card{background:var(--c);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0002}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{width:100%;padding:10px;margin:3px 0;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--c);color:var(--t)}
button{width:100%;padding:12px;margin-top:6px;border:0;border-radius:8px;background:var(--g);color:#fff;font:inherit}
button.g{background:#777}
button.x{width:auto;padding:4px 10px;margin:0;background:#b91c1c}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b)}
nav button{background:none;color:var(--g);border-radius:0;margin:0;flex:1}
nav button.on{font-weight:700;border-top:3px solid var(--g)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--b);padding:6px;text-align:left}
small{color:#888}
@media print{nav,header,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{box-shadow:none}}
</style></head><body>
<header>Stock</header><div id="v"></div>
<nav>
<button data-t="inv" onclick="go('inv')">Inventory</button>
<button data-t="sale" onclick="go('sale')">Sale</button>
<button data-t="pur" onclick="go('pur')">Purchase</button>
<button data-t="rep" onclick="go('rep')">Report</button>
</nav>
<script>
let D;try{D=JSON.parse(localStorage.getItem('stock'))}catch(e){}
D=D||{items:[],moves:[]};
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem('stock',JSON.stringify(D))}catch(e){alert('Data save nahi ho saka')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:2});
const unit=n=>(D.items.find(i=>i.name==n)||{}).unit||'';
function stk(){const s={};D.moves.forEach(m=>s[m.item]=(s[m.item]||0)+(m.type=='out'?-m.qty:m.qty));return s}

const fmt3=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:3});
if(!localStorage.getItem('m1')){const y=D.items.find(i=>i.code=='1367'&&i.unit=='kg');if(y){y.unit='lbs';save()}try{localStorage.setItem('m1','1')}catch(e){}}
function gsum(){
  const s=stk(),C={},U=new Set();let g=0;
  D.items.forEach(i=>{const c=i.cat||'Other',q=s[i.name]||0,o=C[c]=C[c]||{};o[i.unit]=(o[i.unit]||0)+q;g+=q;U.add(i.unit)});
  return {rows:['Fabric','Grey','Yarn','Other'].filter(c=>C[c]).map(c=>[c,Object.entries(C[c]).map(([u,v])=>fmt3(v)+' '+u).join(' + ')]),grand:fmt3(g),mixed:U.size>1};
}
function gHtml(){
  const G=gsum();
  return G.rows.map(r=>`<div class="row" style="margin-top:6px"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')
  +`<div class="row" style="border-top:1px solid var(--b);margin-top:8px;padding-top:8px"><b>Kul jama (sab ka)</b><b>${G.grand}</b></div>`
  +(G.mixed?'<small>Meter aur lbs ka jama sirf number ka hai.</small>':'');
}
function chUnit(k){const i=D.items[k];if(!i)return;const u=prompt('"'+i.name+'" ki nayi unit (meter, kg, lbs, thaan...)',i.unit);
  if(u&&u.trim()&&u.trim()!=i.unit){i.unit=u.trim();save();inv()}}
let tab='inv';
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));draw()}
function draw(){if(tab=='inv')inv();else if(tab=='sale')ent('out');else if(tab=='pur')ent('in');else rep(today())}

function inv(){
  const s=stk();
  $('#v').innerHTML=`<div class="card"><b>Gudam mein kul maal</b>${gHtml()}<small>Unit badalne ke liye item ki unit par dabayein.</small></div>
  <div class="card"><b>Naya item</b>
  <input id="n" placeholder="Item ka naam (jaise Quality A)">
  <input id="u" list="ul" placeholder="Unit (thaan, meter, kg, bags...)">
  <datalist id="ul"><option>thaan</option><option>meter</option><option>kg</option><option>lbs</option><option>bags</option></datalist>
  <input id="o" type="number" step="any" placeholder="Mojooda (opening) stock">
  <button onclick="addItem()">Shamil karein</button></div>`
  +'<input placeholder="Item ya code dhoondein..." oninput="flt(this.value)">'
  +(()=>{let h='',last=null;[...D.items].sort((a,b)=>(a.cat||'Other').localeCompare(b.cat||'Other')).forEach(i=>{const c=i.cat||'Other';
    if(c!=last){h+=`<h3>${esc(c)}</h3>`;last=c}
    h+=`<div class="card row it" data-n="${esc((i.name+' '+(i.code||'')).toLowerCase())}"><span>${esc(i.name)}<br><small>${esc(i.code||'')}</small></span><b>${fmt(s[i.name]||0)} <u style="cursor:pointer" onclick="chUnit(${D.items.indexOf(i)})">${esc(i.unit)}</u></b></div>`});
    return h||'<div class="card">Abhi koi item nahi. Upar se shamil karein.</div>'})()
  +`<div class="card">
  <button class="g" onclick="bk()">Backup lein (Share / Download)</button>
  <input id="f" type="file" hidden onchange="rs(this.files[0])">
  <button class="g" onclick="$('#f').click()">Backup wapas lagayein</button>
  <small>Data sirf is phone ke browser mein hai. Baqaida backup lein.</small></div>`;
}
function addItem(){
  const name=$('#n').value.trim(),u=$('#u').value.trim(),o=+$('#o').value||0;
  if(!name||!u)return alert('Naam aur unit likhein');
  if(D.items.some(i=>i.name.toLowerCase()==name.toLowerCase()))return alert('Ye item pehle se hai');
  D.items.push({name,unit:u});
  if(o>0)D.moves.push({id:Date.now(),date:today(),type:'open',item:name,qty:o,party:'',note:'opening'});
  save();inv();
}

function ent(t){
  if(!D.items.length){$('#v').innerHTML='<div class="card">Pehle Inventory mein item shamil karein.</div>';return}
  const title=t=='in'?'Purchase (maal AAYA)':'Sale (maal GAYA)';
  const last=D.moves.filter(m=>m.type==t).sort((a,b)=>b.id-a.id).slice(0,10);
  $('#v').innerHTML=`<div class="card"><b>${title}</b>
  <select id="i">${D.items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</select>
  <input id="q" type="number" step="any" placeholder="Miqdar">
  <input id="p" placeholder="Party ka naam">
  <input id="d" type="date" value="${today()}">
  <input id="nt" placeholder="Note (zaroori nahi)">
  <button onclick="saveEnt('${t}')">Save</button></div>
  <b>Aakhri entries</b>`
  +(last.map(m=>`<div class="card row"><span>${esc(m.item)}: ${fmt(m.qty)} ${esc(unit(m.item))}<br><small>${m.date} ${esc(m.party||'')}</small></span><button class="x" onclick="del(${m.id})">✕</button></div>`).join('')||'<div class="card">Koi entry nahi</div>');
}
function saveEnt(t){
  const item=$('#i').value,qty=+$('#q').value;
  if(!item||!(qty>0))return alert('Miqdar likhein');
  if(t=='out'&&qty>(stk()[item]||0)&&!confirm('Stock se zyada hai. Phir bhi save karein?'))return;
  D.moves.push({id:Date.now(),date:$('#d').value||today(),type:t,item,qty,party:$('#p').value.trim(),note:$('#nt').value.trim()});
  save();ent(t);
}
function del(id){if(confirm('Ye entry hata dein?')){D.moves=D.moves.filter(m=>m.id!=id);save();draw()}}

let WS=false,ONLY=false;
function repModel(d,ws){
  const sec=(t,h)=>{const r=D.moves.filter(m=>m.date==d&&m.type==t),u={};
    r.forEach(m=>{const k=unit(m.item);u[k]=(u[k]||0)+m.qty});
    return {h,rows:r.map(m=>[m.item,fmt(m.qty)+' '+unit(m.item),m.party||'-']),tot:Object.entries(u).map(([k,v])=>fmt(v)+' '+k).join(' + ')}};
  const s=stk();
  return {d,sec:[sec('in','Purchase (maal AAYA)'),sec('out','Sale (maal GAYA)')],
    stock:ws&&!ONLY?D.items.map(i=>[i.name,fmt(s[i.name]||0)+' '+i.unit,'']):null};
}
function rep(d){
  const R=repModel(d,WS);
  const tb=(rows,tot)=>rows.length?`<table><tr><th>Item</th><th>Miqdar</th><th>Party</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}${tot?`<tr><th>KUL</th><th colspan="2">${esc(tot)}</th></tr>`:''}</table>`:'<p>Koi entry nahi</p>';
  const ck=(v,f,t)=>`<label style="display:block;margin:6px 0"><input type="checkbox" style="width:auto" ${v?'checked':''} onchange="${f}=this.checked;rep($('#d').value)"> ${t}</label>`;
  $('#v').innerHTML=`<div class="card"><input id="d" type="date" value="${d}" onchange="rep(this.value)">
  ${ck(ONLY,'ONLY','Sirf total dikhayein (item ke naam ke baghair)')}${ONLY?'':ck(WS,'WS','Mojooda stock bhi shamil karein')}
  <button onclick="pdf()">PDF banayein / Share</button><div id="pl"></div></div>
  <div class="card"><b>Aaj ka khulasa (${d})</b>
  ${R.sec.map(x=>`<div class="row" style="margin-top:8px"><span>${x.h}</span><b>${esc(x.tot||'0')}</b></div>`).join('')}
  <h3>Gudam mein kul maal</h3>${gHtml()}</div>
  ${ONLY?'':`<div class="card">${R.sec.map(x=>`<h3>${x.h}</h3>`+tb(x.rows,x.tot)).join('')}
  ${R.stock?'<h3>Mojooda stock</h3>'+tb(R.stock,''):''}</div>`}`;
}
async function mkPdf(jpgs){
  const enc=s=>new TextEncoder().encode(s),parts=[],xr=[];let off=0;
  const add=b=>{parts.push(b);off+=b.length};
  const obj=(n,head,bin)=>{xr[n]=off;add(enc(n+' 0 obj\n'+head+(bin?'\nstream\n':'\n')));if(bin){add(bin);add(enc('\nendstream\n'))}add(enc('endobj\n'))};
  const N=jpgs.length;
  add(enc('%PDF-1.4\n'));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids['+jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']/Count '+N+'>>');
  jpgs.forEach((j,i)=>{
    const p=3+3*i,c=enc('q 595 0 0 842 0 0 cm /Im0 Do Q');
    obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');
    obj(p+1,'<</Length '+c.length+'>>',c);
    obj(p+2,'<</Type/XObject/Subtype/Image/Width '+j.w+'/Height '+j.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.b.length+'>>',j.b);
  });
  const total=3+3*N,x=off;
  let t='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)t+=String(xr[n]).padStart(10,'0')+' 00000 n \n';
  add(enc(t+'trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF'));
  return new Blob(parts,{type:'application/pdf'});
}
async function pdf(){
  const d=$('#d').value,R=repModel(d,WS),L=[];
  L.push({k:'h1',t:'STOCK REPORT'},{k:'sub',t:d},{k:'gap'},{k:'h2',t:'Aaj ka khulasa'});
  R.sec.forEach(x=>L.push({k:'sum',c:[x.h,x.tot||'0']}));
  const G=gsum();L.push({k:'gap'},{k:'h2',t:'Gudam mein kul maal'});G.rows.forEach(r=>L.push({k:'sum',c:r}));L.push({k:'sum',c:['Kul jama (sab ka)',G.grand]});
  if(!ONLY){L.push({k:'gap'});
    R.sec.forEach(x=>{L.push({k:'h2',t:x.h});
      if(x.rows.length){L.push({k:'th',c:['Item','Miqdar','Party']});x.rows.forEach(r=>L.push({k:'row',c:r}));L.push({k:'tot',t:'KUL: '+x.tot})}
      else L.push({k:'row',c:['Koi entry nahi','','']});
      L.push({k:'gap'})});
    if(R.stock){L.push({k:'h2',t:'Mojooda stock'},{k:'th',c:['Item','Miqdar','']});R.stock.forEach(r=>L.push({k:'row',c:r}))}}
  const W=1240,H=1754,P=70,LH=42,per=Math.floor((H-2*P)/LH),jpgs=[],X=[P,650,950],CW=[560,280,220];
  for(let a=0;a<L.length;a+=per){
    const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='middle';
    const fit=(v,w)=>{let t=String(v);while(g.measureText(t).width>w&&t.length>1)t=t.slice(0,-1);return t==String(v)?t:t.slice(0,-1)+'…'};
    L.slice(a,a+per).forEach((l,n)=>{
      const y=P+n*LH,m=y+LH/2;
      if(l.k=='h1'){g.font='bold 46px sans-serif';g.fillStyle='#0f766e';g.textAlign='center';g.fillText(l.t,W/2,m);g.textAlign='left'}
      else if(l.k=='sub'){g.font='28px sans-serif';g.fillStyle='#333';g.textAlign='center';g.fillText(l.t,W/2,m);g.textAlign='left'}
      else if(l.k=='h2'){g.fillStyle='#0f766e';g.fillRect(P,y+4,W-2*P,LH-8);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.fillText(l.t,P+12,m)}
      else if(l.k=='th'||l.k=='row'){g.fillStyle='#111';g.font=(l.k=='th'?'bold ':'')+'26px sans-serif';
        l.c.forEach((v,i)=>g.fillText(fit(v,CW[i]),X[i],m));
        g.fillStyle='#bbb';g.fillRect(P,y+LH-1,W-2*P,l.k=='th'?3:1)}
      else if(l.k=='sum'){g.fillStyle='#000';g.font='bold 30px sans-serif';g.fillText(l.c[0],P+12,m);g.fillText(fit(l.c[1],W-X[1]-P),X[1],m);g.fillStyle='#bbb';g.fillRect(P,y+LH-1,W-2*P,1)}
      else if(l.k=='tot'){g.fillStyle='#e6f2f1';g.fillRect(P,y+2,W-2*P,LH-4);g.fillStyle='#000';g.font='bold 28px sans-serif';g.fillText(fit(l.t,W-2*P-20),P+12,m)}
    });
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
    jpgs.push({b:new Uint8Array(await b.arrayBuffer()),w:W,h:H});
  }
  const blob=await mkPdf(jpgs),f=new File([blob],'stock-report-'+d+'.pdf',{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const box=$('#pl');if(box)box.innerHTML=`<p><a href="${url}" download="${f.name}" target="_blank" style="color:var(--g);font-weight:700">📄 PDF tayyar hai - yahan dabayein (save / kholein)</a></p>`;
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Stock Report '+d})}catch(e){}
}
async function bk(){
  const txt=JSON.stringify(D),name='stock-backup-'+today()+'.json';
  try{const f=new File([txt],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Stock Backup'});return}
  }catch(e){if(e.name=='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function rs(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const x=JSON.parse(r.result);
    if(!Array.isArray(x.items)||!Array.isArray(x.moves))throw 0;
    if(confirm('Mojooda data hat kar backup lagayein?')){D=x;save();inv()}
  }catch(e){alert('Ye sahi backup file nahi')}};
  r.readAsText(f);
}
function flt(v){v=v.toLowerCase();document.querySelectorAll('.it').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')}
go('inv');
</script></body></html>
